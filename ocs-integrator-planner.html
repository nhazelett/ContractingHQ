<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Operational Contract Support integrator and planner tool. Learn the three functions, the contracting C2 continuum, the OCSIC, and the planning products, then use the job aids in the field." />
<title>OCS Integrator &amp; Planner | ContractingHQ</title>
<style>
/* ============================================================
   Theme tokens. Retheme here.
   ============================================================ */
:root {
  --bg: #040d1f;
  --bg-raised: #0a1632;
  --panel: rgba(10, 22, 50, 0.55);
  --panel-solid: #0c1a3a;
  --panel-border: rgba(74, 158, 255, 0.18);
  --panel-border-strong: rgba(74, 158, 255, 0.4);
  --accent: #4a9eff;
  --accent-dim: rgba(74, 158, 255, 0.12);
  --text: #c9d5e3;
  --muted: #8a9bb0;
  --faint: #5b6f8a;
  --white: #f2f6fa;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --verify: #fbbf24;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
}

/* ===== Header ===== */
.hdr {
  position: sticky; top: 0; z-index: 50;
  background: rgba(4, 13, 31, 0.96);
  border-bottom: 1px solid var(--panel-border);
  padding: .6rem 1rem;
  display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
}
.hdr .brand {
  font-weight: 800; letter-spacing: 1px; color: var(--white);
  text-decoration: none; font-size: .95rem; white-space: nowrap;
}
.hdr .brand span { color: var(--accent); }
.hdr .tool-name { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.hdr .spacer { flex: 1; }
.hdr .role-tag {
  font-size: .72rem; letter-spacing: 1px; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--panel-border-strong);
  border-radius: 20px; padding: .15rem .7rem; white-space: nowrap;
}
.btn {
  background: var(--accent); color: #04102a; border: none; border-radius: 8px;
  font-family: var(--font); font-weight: 700; font-size: .88rem;
  padding: .55rem 1.1rem; cursor: pointer; transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn.ghost {
  background: transparent; color: var(--accent);
  border: 1px solid var(--panel-border-strong);
}
.btn.ghost:hover { background: var(--accent-dim); opacity: 1; }
.btn.small { font-size: .76rem; padding: .35rem .8rem; }
.btn:disabled { opacity: .35; cursor: not-allowed; }

/* ===== Layout ===== */
.wrap { max-width: 1040px; margin: 0 auto; padding: 1.4rem 1rem 5rem; }
h1 { color: var(--white); font-size: 1.55rem; margin: .2rem 0 .4rem; line-height: 1.25; }
h2 { color: var(--white); font-size: 1.18rem; margin: 1.6rem 0 .5rem; }
h3 { color: var(--white); font-size: 1rem; margin: 1.1rem 0 .35rem; }
p { margin: .5rem 0; }
.sub { color: var(--muted); font-size: .92rem; }
.card {
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; padding: 1rem 1.1rem; margin: .8rem 0;
}
.card.accent-left { border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; }
.grid { display: grid; gap: .8rem; }
@media (min-width: 720px) {
  .grid.cols2 { grid-template-columns: 1fr 1fr; }
  .grid.cols4 { grid-template-columns: repeat(4, 1fr); }
}
.kicker {
  font-size: .7rem; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--accent); font-weight: 700; margin-bottom: .25rem;
}
ul.tight { margin: .4rem 0; padding-left: 1.15rem; }
ul.tight li { margin: .3rem 0; }

/* ===== Role cards (landing) ===== */
.role-card {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; padding: 1rem 1.1rem; color: var(--text);
  font-family: var(--font); font-size: .92rem; transition: border-color .15s, transform .15s;
}
.role-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.role-card .rc-title { color: var(--white); font-weight: 700; font-size: 1.02rem; display: block; margin-bottom: .25rem; }
.role-card .rc-sub { color: var(--muted); font-size: .84rem; }
.role-card .rc-time { color: var(--faint); font-size: .74rem; display: block; margin-top: .5rem; }

/* ===== Term chips + popover ===== */
.term {
  color: var(--accent); border-bottom: 1px dotted rgba(74,158,255,.5);
  cursor: pointer; font-weight: 600;
}
.pop-back {
  position: fixed; inset: 0; background: rgba(2,7,17,.72); z-index: 90;
  display: flex; align-items: flex-end; justify-content: center; padding: 0;
}
@media (min-width: 720px) { .pop-back { align-items: center; padding: 2rem; } }
.pop {
  background: var(--panel-solid); border: 1px solid var(--panel-border-strong);
  border-radius: 12px 12px 0 0; padding: 1.1rem 1.2rem 1.4rem;
  width: 100%; max-width: 560px; max-height: 80vh; overflow: auto;
}
@media (min-width: 720px) { .pop { border-radius: 12px; } }
.pop .pop-title { color: var(--white); font-weight: 700; font-size: 1.05rem; margin: 0 0 .1rem; }
.pop .pop-full { color: var(--muted); font-size: .8rem; margin-bottom: .6rem; }
.pop .pop-links { margin-top: .8rem; display: flex; flex-wrap: wrap; gap: .4rem; }
.pop-close { float: right; background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; padding: 0 .2rem; }
.link-chip {
  display: inline-block; font-size: .74rem; padding: .2rem .6rem;
  border: 1px solid var(--panel-border); border-radius: 14px;
  color: var(--text); cursor: pointer; background: var(--accent-dim);
}
.link-chip:hover { border-color: var(--accent); }
.badge {
  display: inline-block; font-size: .66rem; letter-spacing: 1px; text-transform: uppercase;
  padding: .1rem .5rem; border-radius: 10px; font-weight: 700; vertical-align: middle;
}
.badge.fn { background: rgba(74,222,128,.12); color: var(--good); }
.badge.c2 { background: rgba(251,191,36,.12); color: var(--warn); }
.badge.cell { background: rgba(74,158,255,.15); color: var(--accent); }
.badge.product { background: rgba(196,145,255,.14); color: #c491ff; }
.badge.term { background: rgba(148,163,184,.15); color: var(--muted); }
.sme-verify {
  display: inline-block; background: rgba(251,191,36,.12); color: var(--verify);
  border: 1px solid rgba(251,191,36,.4); border-radius: 4px;
  font-size: .68rem; font-weight: 700; letter-spacing: .8px; padding: 0 .4rem;
  text-transform: uppercase;
}

/* ===== Concept map ===== */
.map-box { overflow-x: auto; }
.map-svg { width: 100%; min-width: 640px; height: auto; display: block; }
.map-hint { font-size: .74rem; color: var(--faint); margin: .2rem 0 .5rem; }
.map-node { cursor: pointer; }
.map-node rect { fill: var(--panel-solid); stroke: var(--panel-border-strong); stroke-width: 1; rx: 8; transition: stroke .15s; }
.map-node text { fill: var(--text); font-family: var(--font); font-size: 13px; pointer-events: none; }
.map-node .nlabel { fill: var(--white); font-weight: 700; }
.map-node .nsub { fill: var(--muted); font-size: 10.5px; }
.map-node.sel rect { stroke: var(--accent); stroke-width: 2; fill: #10254d; }
.map-node.linked rect { stroke: var(--good); stroke-width: 1.6; }
.map-node.dim { opacity: .32; }
.map-edge { stroke: rgba(74,158,255,.28); stroke-width: 1.4; fill: none; transition: stroke .15s; }
.map-edge.hot { stroke: var(--good); stroke-width: 2.2; }
.map-edge.dim { opacity: .15; }
.map-lane { fill: var(--faint); font-size: 10px; letter-spacing: 2px; font-family: var(--font); text-transform: uppercase; }
.map-detail { min-height: 90px; }

/* ===== Learn track ===== */
.progress-row { display: flex; align-items: center; gap: .6rem; margin: .6rem 0 1rem; flex-wrap: wrap; }
.pbar { flex: 1 1 160px; height: 8px; background: var(--accent-dim); border-radius: 4px; overflow: hidden; }
.pbar > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
.pcount { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.toc { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: 1rem; }
.toc button {
  background: none; border: 1px solid var(--panel-border); color: var(--muted);
  font-size: .72rem; border-radius: 14px; padding: .2rem .65rem; cursor: pointer; font-family: var(--font);
}
.toc button.done { color: var(--good); border-color: rgba(74,222,128,.4); }
.toc button.cur { color: var(--accent); border-color: var(--accent); font-weight: 700; }
.nav-row { display: flex; justify-content: space-between; gap: .6rem; margin-top: 1.4rem; }

/* ===== Quiz ===== */
.quiz { border: 1px solid var(--panel-border-strong); border-radius: 10px; padding: 1rem 1.1rem; margin: 1.1rem 0; background: rgba(4,13,31,.5); }
.quiz .q-kicker { font-size: .68rem; letter-spacing: 1.4px; text-transform: uppercase; color: var(--warn); font-weight: 700; }
.quiz .q-text { color: var(--white); font-weight: 600; margin: .35rem 0 .7rem; }
.q-opt {
  display: block; width: 100%; text-align: left; margin: .35rem 0;
  background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
  border-radius: 8px; padding: .55rem .8rem; cursor: pointer; font-family: var(--font); font-size: .88rem;
}
.q-opt:hover { border-color: var(--accent); }
.q-opt.right { border-color: var(--good); color: var(--good); }
.q-opt.wrong { border-color: var(--bad); color: var(--bad); }
.q-fb { font-size: .84rem; margin-top: .6rem; display: none; }
.q-fb.show { display: block; }

/* ===== Decision aid ===== */
.aid-q { margin: 1rem 0; }
.aid-q .aq-label { color: var(--white); font-weight: 600; font-size: .94rem; margin-bottom: .4rem; }
.aid-opt {
  display: block; width: 100%; text-align: left; margin: .3rem 0;
  background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
  border-radius: 8px; padding: .5rem .75rem; cursor: pointer; font-family: var(--font); font-size: .85rem;
}
.aid-opt:hover { border-color: var(--accent); }
.aid-opt.on { border-color: var(--accent); background: var(--accent-dim); color: var(--white); }
.aid-result { border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; }
.aid-verdict { color: var(--white); font-size: 1.15rem; font-weight: 800; }
.spectrum { display: flex; gap: .3rem; margin: .7rem 0; flex-wrap: wrap; }
.spec-step {
  flex: 1 1 90px; text-align: center; font-size: .68rem; letter-spacing: .5px;
  padding: .45rem .3rem; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--muted);
}
.spec-step.on { border-color: var(--accent); color: var(--white); background: var(--accent-dim); font-weight: 700; }
.disclaimer {
  border: 1px solid rgba(251,191,36,.35); border-left: 3px solid var(--warn);
  border-radius: 0 8px 8px 0; padding: .6rem .9rem; font-size: .8rem; color: #fbe28b; margin-top: 1rem;
}

/* ===== Checklists / job aid bits ===== */
.check-item { display: flex; gap: .55rem; align-items: flex-start; padding: .3rem 0; font-size: .9rem; }
.check-item input { margin-top: .25rem; accent-color: var(--accent); }
.mini-table { width: 100%; border-collapse: collapse; font-size: .84rem; margin: .6rem 0; }
.mini-table th { text-align: left; color: var(--accent); font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; padding: .4rem .5rem; border-bottom: 1px solid var(--panel-border-strong); }
.mini-table td { padding: .45rem .5rem; border-bottom: 1px solid var(--panel-border); vertical-align: top; }
.mini-table td:first-child { color: var(--white); font-weight: 600; white-space: nowrap; }
.table-scroll { overflow-x: auto; }

/* ===== Scenario stepper + reveals ===== */
.phase-tabs { display: flex; gap: .35rem; flex-wrap: wrap; margin: .8rem 0; }
.phase-tabs button {
  flex: 1 1 120px; background: var(--panel); border: 1px solid var(--panel-border);
  color: var(--muted); border-radius: 8px; padding: .5rem .4rem; cursor: pointer;
  font-family: var(--font); font-size: .74rem; line-height: 1.3;
}
.phase-tabs button strong { display: block; color: var(--text); font-size: .82rem; }
.phase-tabs button.on { border-color: var(--accent); background: var(--accent-dim); }
.phase-tabs button.on strong { color: var(--white); }
.beat { display: flex; gap: .6rem; align-items: flex-start; padding: .45rem 0; border-bottom: 1px solid var(--panel-border); font-size: .9rem; }
.beat:last-child { border-bottom: none; }
.beat .beat-n {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-dim); color: var(--accent); font-weight: 800; font-size: .74rem;
  display: flex; align-items: center; justify-content: center; margin-top: .1rem;
}
.new-chips { margin-top: .7rem; }
.new-chips .kicker { margin-bottom: .3rem; }
.reveal-item { border: 1px solid var(--panel-border); border-radius: 8px; margin: .55rem 0; overflow: hidden; }
.reveal-btn {
  display: block; width: 100%; text-align: left; background: var(--panel);
  border: none; color: var(--text); font-family: var(--font); font-size: .9rem;
  padding: .65rem .85rem; cursor: pointer;
}
.reveal-btn .rv-time { color: var(--accent); font-weight: 700; font-family: var(--mono); font-size: .8rem; margin-right: .5rem; }
.reveal-btn:hover { background: var(--accent-dim); }
.reveal-body { padding: .6rem .85rem .8rem; border-top: 1px solid var(--panel-border); font-size: .86rem; background: rgba(4,13,31,.5); }
.reveal-body .rv-tag { color: var(--good); font-weight: 700; font-size: .74rem; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: .25rem; }

.back-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: .82rem; font-family: var(--font); padding: 0; margin-bottom: .6rem; }
.back-link:hover { text-decoration: underline; }
footer.ft { border-top: 1px solid var(--panel-border); color: var(--faint); font-size: .74rem; padding: 1.2rem 1rem 2rem; text-align: center; }
footer.ft a { color: var(--accent); text-decoration: none; }
.index-list { columns: 2; column-gap: 1.5rem; }
@media (max-width: 560px) { .index-list { columns: 1; } }
.index-list button { display: block; background: none; border: none; color: var(--accent); font-family: var(--font); font-size: .86rem; cursor: pointer; padding: .18rem 0; text-align: left; }
.index-list button:hover { text-decoration: underline; }
.synth {
  font-size: 1.02rem; color: var(--white); font-weight: 600;
  border: 1px solid var(--panel-border-strong); border-radius: 10px;
  padding: .9rem 1rem; background: var(--accent-dim); margin: 1rem 0;
}
</style>
</head>
<body>

<header class="hdr">
  <a class="brand" href="index.html"><span>KTHQ</span> ContractingHQ</a>
  <span class="tool-name">OCS Integrator &amp; Planner</span>
  <span class="spacer"></span>
  <span class="role-tag" id="roleTag" style="display:none;"></span>
  <button class="btn ghost small" id="homeBtn" style="display:none;">Change role</button>
</header>

<main class="wrap" id="app"></main>

<footer class="ft">
  Operational Contract Support planning aid. Educational tool, not an authority document. Doctrine basis: JP 4-10.
  Items tagged SME-VERIFY need confirmation against current doctrine before you rely on them.
  Part of <a href="tools.html">KTHQ Tools</a>.
</footer>

<script>
"use strict";
/* ============================================================
   CONTENT MODEL
   Every node answers one of four questions:
     who integrates (cell), who decides the approach (c2),
     who executes (fn), what gets produced (product).
   Terms anchor to a function, a C2 option, or a product.
   Text supports {{t:id}} inline term chips.
   ============================================================ */

const NODES = {
  /* ----- the integration cell ----- */
  ocsic: {
    type: "cell", short: "OCSIC", full: "Operational Contract Support Integration Cell",
    def: "The staff cell in the combatant command or joint force command J4 that plans and integrates Operational Contract Support across the force. The OCSIC runs the {{t:csi}} function, drafts {{t:annexw}}, the {{t:csip}}, and the {{t:cmp}}, and drives the OCS battle rhythm ({{t:jrrb}}, {{t:jcsb}}). It is a staff cell, not a command. It exists no matter which C2 option the commander picks, and it sits above the C2 continuum: the continuum decides who contracts, the OCSIC keeps the whole effort synchronized.",
    connects: ["csi", "annexw", "csip", "cmp", "jrrb", "jcsb"],
    roles: ["planner", "integrator", "cco"]
  },

  /* ----- three functions (JP 4-10) ----- */
  csi: {
    type: "fn", short: "CSI", full: "Contract Support Integration",
    def: "Planning and synchronizing contracted support across the joint force. CSI turns every component's requirements into one coherent picture: what gets contracted, by whom, in what phase, and how it stays aligned with the operation. The {{t:ocsic}} performs this function at the theater level, and its main written outputs are {{t:annexw}} and the {{t:csip}}.",
    connects: ["ocsic", "csip", "annexw", "jrrb"],
    roles: ["planner", "integrator"]
  },
  csupport: {
    type: "fn", short: "Contracting Support", full: "Contracting Support",
    def: "Awarding and administering contracts in support of the operation: solicit, award, administer, close out. This is the contracting officer's function. The {{t:continuum}} decides how this function is organized across components, which is why the C2 choice matters so much to the {{t:cco}}. Most of the continuum applies to {{t:theater}}; external and systems support contracts keep their own chains.",
    connects: ["sr", "lscc", "lsc", "joint", "theater", "cco"],
    roles: ["planner", "integrator", "cco"]
  },
  cmgmt: {
    type: "fn", short: "Contractor Management", full: "Contractor Management",
    def: "Maintaining accountability, visibility, and force protection of contractor personnel in the operational area. It covers {{t:caaf}} status decisions, {{t:spot}} registration and reporting, movement control, medical support, and life support. The written plan for all of it is the {{t:cmp}}.",
    connects: ["caaf", "spot", "cmp"],
    roles: ["planner", "integrator", "cco"]
  },

  /* ----- the contracting C2 continuum ----- */
  sr: {
    type: "c2", short: "Service-retained", full: "Service-Retained Contracting (default)",
    verb: "each for itself",
    def: "The default. Each component contracts for its own requirements under its own authorities. No lead designated, no cross-component structure. Every other option on the {{t:continuum}} is a deliberate move away from this starting point, made because overlap, competition for the same vendors, or common requirements start costing the force money and effectiveness.",
    connects: ["csupport", "lscc"],
    roles: ["planner", "integrator", "cco"]
  },
  lscc: {
    type: "c2", short: "LSCC", full: "Lead Service for Contracting Coordination",
    verb: "COORDINATE",
    def: "One Service coordinates and deconflicts contracting across components: shared visibility, deconflicted buys, common business rules, often through a {{t:jcsb}}. Coordination only. Each component keeps its own contracting authority, and the lead has no directive authority and does not execute contracts for the others. If someone tells you an LSCC can direct another component's contracting, they have it wrong.",
    connects: ["csupport", "sr", "lsc", "jcsb"],
    roles: ["planner", "integrator", "cco"]
  },
  lsc: {
    type: "c2", short: "LSC", full: "Lead Service for Contracting",
    verb: "EXECUTE",
    def: "The designated Service executes contracting for specified common supplies and services on behalf of the other components. That is the jump from LSCC: the lead stops just coordinating and starts awarding for others, but only for the designated common items. Components still contract for everything outside that list under their own authorities.",
    connects: ["csupport", "lscc", "joint"],
    roles: ["planner", "integrator", "cco"]
  },
  joint: {
    type: "c2", short: "Joint construct", full: "Joint Theater Support Contracting Command (JTSCC) or lead Service with a joint command element",
    verb: "DIRECT",
    def: "A joint contracting command with directive authority over theater support contracting. Contracting forces from multiple components work under one commander with one set of priorities. This is the Iraq and Afghanistan model (the JTSCC). It buys unity of effort at the price of standing up and running a joint command, so it fits large, sustained, highly joint operations.",
    connects: ["csupport", "lsc"],
    roles: ["planner", "integrator", "cco"]
  },
  continuum: {
    type: "c2", short: "C2 continuum", full: "The contracting command and control continuum",
    verb: "the spectrum",
    def: "The range of options for organizing theater contracting, in increasing degrees of centralization: {{t:sr}}, then {{t:lscc}}, then {{t:lsc}}, then the {{t:joint}}. The central lesson is the verb ladder: an LSCC coordinates, an LSC executes for designated common items, and a joint construct directs. The continuum decides who contracts. It does not replace the {{t:ocsic}}, which integrates above all of it.",
    connects: ["sr", "lscc", "lsc", "joint", "ocsic"],
    roles: ["planner", "integrator", "cco"]
  },

  /* ----- planning products ----- */
  annexw: {
    type: "product", short: "Annex W", full: "Annex W (Operational Contract Support annex to the OPLAN or OPORD)",
    def: "The Operational Contract Support annex to the operation plan or order. It states how contracted support will be integrated, organized, and managed for the operation, including the C2 approach for theater contracting. The {{t:ocsic}} drafts it through the {{t:csi}} function. The {{t:csip}} and {{t:cmp}} are developed with it and normally published as appendices to it. <span class=\"sme-verify\">SME-VERIFY</span> Confirm your command's Annex W format and appendix structure against current JOPES/JPP guidance.",
    connects: ["ocsic", "csi", "csip", "cmp"],
    roles: ["planner", "integrator"]
  },
  csip: {
    type: "product", short: "CSIP", full: "Contract Support Integration Plan",
    def: "The detailed plan for synchronizing contracted support: requirements by phase, the theater contracting organization, boards and review gates, and priorities of support. The {{t:ocsic}} produces it through the {{t:csi}} function. If {{t:annexw}} says what the approach is, the CSIP is the working plan that makes it executable.",
    connects: ["ocsic", "csi", "annexw"],
    roles: ["planner", "integrator"]
  },
  cmp: {
    type: "product", short: "CMP", full: "Contractor Management Plan",
    def: "The plan for accountability, visibility, and support of contractor personnel: {{t:caaf}} determinations and support levels, {{t:spot}} business rules, movement, medical, life support, and force protection. It is the tangible output of the {{t:cmgmt}} function, and the place a {{t:cco}} looks to know what contractor management language belongs in contracts.",
    connects: ["cmgmt", "caaf", "spot", "annexw"],
    roles: ["planner", "integrator", "cco"]
  },

  /* ----- supporting terms ----- */
  caaf: {
    type: "term", short: "CAAF", full: "Contractors Authorized to Accompany the Force",

    {
      id: "commonality", label: "How common are requirements across components",
      opts: [
        "Mostly unique to each component",
        "Some overlap in a few categories",
        "Substantial common demand (life support, fuel handling, transportation)",
        "Most theater requirements are common across the force"
      ]
    },
    {
      id: "maturity", label: "Maturity of the theater contracting footprint",
      opts: [
        "Little or no theater contracting structure yet",
        "Component activities operating independently, little friction so far",
        "Established activities with overlap and competition for the same vendors",
        "Large mature footprint with persistent overlap and enduring common requirements"
      ]
    }
  ],
  /* returns {pick, reasons[], capNote} */
  evaluate(a) {
    const score = a.scale + a.jointness + a.commonality + a.maturity;
    let pick;
    if (score <= 2) pick = "sr";
    else if (score <= 5) pick = "lscc";
    else if (score <= 8) pick = "lsc";
    else pick = "joint";

    let capNote = null;
    const order = ["sr", "lscc", "lsc", "joint"];
    const cap = (max, note) => {
      if (order.indexOf(pick) > order.indexOf(max)) { pick = max; capNote = note; }
    };
    if (a.jointness === 0) {
      cap("sr", "One component is doing nearly all the contracting, so there is no cross-component problem to solve. Centralizing would add structure without adding value.");
    }
    if (a.commonality === 0) {
      cap("lscc", "With little common demand there is nothing for a lead to execute on behalf of others. Coordination (visibility and deconfliction) is the ceiling until common requirements emerge.");
    }
    if (pick === "joint" && (a.scale < 2 || a.jointness < 2)) {
      pick = "lsc";
      capNote = "A joint construct needs scale and jointness to pay for itself. Below that threshold, designating a lead Service to execute the common items gets most of the benefit without standing up a joint command.";
    }

    const reasons = [];
    reasons.push(["Scale",
      ["Small and short favors the default: each component contracts for itself and the fight ends before centralization pays off.",
       "Moderate scale starts to reward shared visibility across components.",
       "Large sustained operations generate enough volume that overlap costs real money and vendor capacity.",
       "A major campaign makes centralized theater contracting a question of when, not whether."][a.scale]]);
    reasons.push(["Jointness",
      ["With one component doing the contracting, cross-component C2 solves a problem you do not have.",
       "A dominant component with minor players usually needs coordination at most.",
       "Several components with real workload means real collision: same vendors, same commodities, same battlespace.",
       "A fully joint contracting picture is the strongest driver toward a lead or a joint command."][a.jointness]]);
    reasons.push(["Commonality",
      ["Unique requirements stay with the component that owns them; no lead can buy them better.",
       "Limited overlap supports common business rules, not common execution.",
       "Substantial common demand is the classic trigger for an LSC: designate the items, let one Service buy them once.",
       "When most demand is common, consolidated execution or joint direction captures the most value."][a.commonality]]);
    reasons.push(["Footprint maturity",
      ["No structure yet means keep it simple and build visibility first.",
       "Independent activities without friction do not yet justify a lead.",
       "Overlap and vendor competition between activities is the symptom coordination (and then execution) exists to fix.",
       "Persistent overlap with enduring common requirements is the picture that historically drove the joint construct."][a.maturity]]);

    return { pick, reasons, capNote, score };
  }
};

function edgePath(a, b) {
  const A = MAP_POS[a], B = MAP_POS[b];
  if (!A || !B) return null;
  let x1, y1, x2, y2;
  if (Math.abs(A.y - B.y) < 10) {
    if (A.x < B.x) { x1 = A.x + A.w; y1 = A.y + A.h / 2; x2 = B.x; y2 = B.y + B.h / 2; }
    else { x1 = A.x; y1 = A.y + A.h / 2; x2 = B.x + B.w; y2 = B.y + B.h / 2; }
    return `M ${x1} ${y1} L ${x2} ${y2}`;
  }
  const top = A.y < B.y ? A : B, bot = A.y < B.y ? B : A;
  x1 = top.x + top.w / 2; y1 = top.y + top.h;
  x2 = bot.x + bot.w / 2; y2 = bot.y;
  const my = (y1 + y2) / 2;
  return `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
}

      <g id="edgeLayer">${edges}</g>
      ${nodes}
      <g>
        <line x1="30" y1="330" x2="710" y2="330" stroke="rgba(251,191,36,.45)" stroke-width="1.4" marker-end="url(#arr)"/>
        <text x="375" y="348" text-anchor="middle" style="fill:var(--warn);font-size:11px;letter-spacing:1px;">centralization increases: coordinate, execute, direct</text>
      </g>
    </svg></div>
    <div class="map-detail" id="mapDetail">
      <p class="sub">Nothing selected yet. Start with OCSIC at the top, then walk the C2 row.</p>

function selectMapNode(id) {
  const n = NODES[id];
  if (!n || !MAP_POS[id]) return;
  document.querySelectorAll(".map-node").forEach(g => {

function quizHTML(check, key) {
  return `

}
function findCheck(key) {
  const parts = key.split("|");
  const sec = LEARN.find(s => s.id === parts[0]);
  if (!sec) return null;
  return parts[1] === "2" ? sec.check2 : sec.check;
}
function answerQuiz(key, optIdx) {
  const check = findCheck(key);
  if (!check) return;
  S.checks[key] = optIdx;
  save();
  const box = document.querySelector(`[data-quizbox="${key}"]`);
  if (!box) return;
  box.querySelectorAll(".q-opt").forEach((b, i) => {
    b.classList.remove("right", "wrong");
    if (check.opts[i].ok) b.classList.add("right");
    else if (i === optIdx) b.classList.add("wrong");
  });
  const fb = box.querySelector(".q-fb");
  fb.textContent = check.opts[optIdx].fb;
  fb.classList.add("show");
}

    <h2>Pick the C2 recommendation</h2>
    ${aidHTML("planner")}

    <h2>See the whole model</h2>
    ${conceptMapHTML()}
    ${indexHTML()}
  `;
  hydrateTermTokens();
  window.scrollTo(0, 0);
}

/* Template strings above embed {{t:x}} inside plain HTML in a few spots; convert them after render. */
function hydrateTermTokens() {
  if (/\{\{t:/.test(app.innerHTML)) app.innerHTML = T(app.innerHTML);
}

/* ============================================================
   ROUTER + EVENTS
   ============================================================ */
function route() {
  closePop();
  if (!S.role) {
    roleTag.style.display = "none";
    homeBtn.style.display = "none";
    renderLanding();
  } else {
    roleTag.textContent = ROLES[S.role].tag;
    roleTag.style.display = "";
    homeBtn.style.display = "";
    if (S.role === "learn") renderLearn();
    else if (S.role === "planner") renderPlanner();
    else if (S.role === "integrator") renderIntegrator();
    else renderCco();
  }
}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-role],[data-role-clear],[data-term],[data-node],[data-mapjump],[data-quiz],[data-aid],[data-learn-nav],[data-learn-finish],[data-goto],[data-popclose],[data-popback],[data-phase],[data-reveal]");
  if (!t) return;
  if (t.dataset.popback === "1" && ev.target !== t) {
    /* click inside the dialog: ignore backdrop close */
  } else if (t.dataset.popback === "1") { closePop(); return; }
  if (t.dataset.popclose) { closePop(); return; }
  if (t.dataset.role) { S.role = t.dataset.role; save(); route(); return; }
  if (t.dataset.roleClear) { S.role = null; save(); route(); return; }
  if (t.dataset.term) { openTerm(t.dataset.term); return; }
  if (t.dataset.node) { selectMapNode(t.dataset.node); return; }
  if (t.dataset.mapjump) {
    closePop();
    const id = t.dataset.mapjump;
    const card = document.getElementById("mapCard");
    if (card) { selectMapNode(id); card.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else openTerm(id);
    return;
  }
  if (t.dataset.quiz) { answerQuiz(t.dataset.quiz, parseInt(t.dataset.opt, 10)); return; }
  if (t.dataset.aid) {
    S.aid[t.dataset.aid] = parseInt(t.dataset.val, 10);
    save();
    const box = document.getElementById("aidBox");
    if (box) {
      box.querySelectorAll(`[data-aid="${t.dataset.aid}"]`).forEach(b => b.classList.toggle("on", b === t));
      document.getElementById("aidResult").innerHTML = aidResultHTML();
    }
    return;
  }
  if (t.dataset.learnNav) {
    const dir = parseInt(t.dataset.learnNav, 10);
    if (dir > 0) S.learnDone[LEARN[S.learnIdx].id] = true;
    S.learnIdx = Math.max(0, Math.min(LEARN.length - 1, S.learnIdx + dir));
    save();
    renderLearn();
    return;
  }
  if (t.dataset.learnFinish) {
    S.learnDone[LEARN[S.learnIdx].id] = true;
    S.role = null;
    save();
    route();
    return;
  }
  if (t.dataset.goto) { S.learnIdx = parseInt(t.dataset.goto, 10); save(); renderLearn(); return; }
  if (t.dataset.phase) { S.scnPhase = parseInt(t.dataset.phase, 10); save(); renderPhase(S.scnPhase); return; }
  if (t.dataset.reveal) {
    const body = document.getElementById(t.dataset.reveal);
    if (body) body.hidden = !body.hidden;
    return;
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target.closest("[data-check]");
  if (!t) return;
  S[t.dataset.check] = t.checked;
  save();
});

document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closePop(); });

homeBtn.addEventListener("click", () => { S.role = null; save(); route(); });

route();
</script>
