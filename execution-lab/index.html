function reviewRows(){return state.history.map(row=>{const c=CARD[row.cardId],notes=rowNotes(row),severity=row.flagsSet.some(f=>SCENARIO.severe.includes(f))?'severe':row.flagsSet.some(f=>SCENARIO.costFlags.includes(f))||row.effectsApplied.mission<0||row.effectsApplied.file<0?'cost':'held';return `<section class="review-row"><div class="review-row-top"><p class="eyebrow">${text(SCENARIO.phases[c.phase-1])}</p><span class="verdict ${severity}">${text(SCENARIO.ui[severity])}</span></div><h2>${text(c.title)}</h2><p class="review-label">${text(SCENARIO.ui.decisionDetail)}</p><p>${escapeHTML(row.label)}</p><p class="review-label">${text(SCENARIO.ui.consequence)}</p><p>${escapeHTML(row.reaction)}</p>${notes.length?`<ul>${notes.map(n=>`<li>${text(n.text)}</li>`).join('')}</ul>`:''}${row.cardId==='D9'?state.events.map(e=>`<p class="event-note">${escapeHTML(e.text)}</p>`).join(''):''}<div class="teaching"><p class="review-label">${text(SCENARIO.ui.teaching)}</p><p>${text(c.teaching)}</p></div>${c.referenceValidated&&/^https:\/\//.test(c.reference)?`<a class="reference" href="${escapeHTML(c.reference)}" target="_blank" rel="noopener noreferrer">${text(SCENARIO.ui.reference)}</a>`:`<span class="reference pending">${text(SCENARIO.ui.referencePending)}</span>`}</section>`;}).join('');}
function reviewScreen(){return `${header(state)}<main id="content" class="review-screen"><div class="review-intro"><p class="eyebrow">${text(SCENARIO.settings[state.setting].reviewer)}</p><h1 tabindex="-1">${text(SCENARIO.ui.reviewTitle)}</h1><p>${text(SCENARIO.settings[state.setting].reviewIntro)}</p><p class="muted">${text(SCENARIO.ui.reviewNote)}</p></div><div class="review-rows">${reviewRows()}</div><section class="supervisor"><h2>${text(SCENARIO.ui.printTitle)}</h2><p>${text(SCENARIO.ui.supervisorNote)}</p>${button(text(SCENARIO.ui.supervisor),'print')}</section>${button(text(SCENARIO.ui.reviewNext)+' <span aria-hidden="true">→</span>','replay-screen','',true)}${footer()}</main>`;}
function replayScreen(){const tease=!has(state,'GOOD_MR')?SCENARIO.replay.missingVendor:has(state,'LATE')?SCENARIO.replay.late:SCENARIO.replay.default;return `${header(state)}<main id="content"><article class="card"><div class="card-body"><p class="eyebrow">${text(SCENARIO.ui.outcome)} · ${text(SCENARIO.endings[ending(state)].title)}</p><h1 tabindex="-1">${text(SCENARIO.replay.title)}</h1><p class="event-text">${text(tease)}</p><div class="stack">${button(text(SCENARIO.ui.replay),'again','',true)}${button(text(SCENARIO.ui.other),'other')}${button(text(SCENARIO.ui.review),'review')}</div></div></article>${footer()}</main>`;}
function debugPanel(){return `<details class="debug"><summary>${text(SCENARIO.ui.debug)}</summary><p>${text(SCENARIO.ui.debugNote)}</p><label>${text(SCENARIO.ui.jumpTo)}<select id="debugCard">${SCENARIO.route.map(id=>`<option ${id===SCENARIO.route[state.cursor]?'selected':''}>${id}</option>`).join('')}</select></label><div class="debug-meters">${['clock','mission','file'].map(k=>`<label>${text(SCENARIO.ui[k])}<input type="number" id="debug-${k}" value="${state[k]}"></label>`).join('')}</div><fieldset><legend>${text(SCENARIO.ui.flagLabel)}</legend>${SCENARIO.flags.map(f=>`<label><input type="checkbox" name="debugFlag" value="${f}" ${has(state,f)?'checked':''}>${f}</label>`).join('')}</fieldset>${button(text(SCENARIO.ui.apply),'debug-apply')}${button(text(SCENARIO.ui.simulate),'debug-simulate')}<pre id="debugResult"></pre></details>`;}
function render(focus=false){const oldMeters=[...document.querySelectorAll('.meters progress')].map(p=>Number(p.value));$('#app').innerHTML=!state?titleScreen():({decision:decisionScreen,event:eventScreen,outcome:outcomeScreen,review:reviewScreen,replay:replayScreen}[state.screen]||outcomeScreen)();document.documentElement.dataset.setting=state?.setting||titleSetting;if(focus){window.scrollTo({top:0,behavior:'instant'});$('#content h1')?.focus({preventScroll:true});}if(state&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.meters progress').forEach((p,i)=>{const target=p.value;if(oldMeters[i]!==undefined&&oldMeters[i]!==target){p.value=oldMeters[i];requestAnimationFrame(()=>requestAnimationFrame(()=>{if(p.isConnected)p.value=target;}));}});}if(state)$('#announcer').textContent=`${SCENARIO.ui.mission} ${state.mission}. ${SCENARIO.ui.file} ${state.file}. ${state.awarded?SCENARIO.ui.timeline:SCENARIO.ui.clock+' '+state.clock}.`;}
function begin(setting){titleSetting=setting;debugRun=false;state=stateFor(setting,Math.floor(Math.random()*2147483647));persist();render(true);}
function dialog(body){const d=$('#drawer');d.innerHTML=body;d.showModal();}
function advice(){const c=CARD[SCENARIO.route[state.cursor]];if(!state.advice.includes(c.id)){state.advice.push(c.id);persist();}dialog(`<div class="drawer-head"><h2>${text(SCENARIO.ui.adviceTitle)}</h2>${button('×','close','aria-label="Close advice"')}</div><p class="muted">${text(SCENARIO.ui.adviceNote)}</p>${Object.entries(c.advice).map(([role,line])=>`<section class="adviser">${portrait(role,state)}<p>“${text(line)}”</p></section>`).join('')}${button(text(SCENARIO.ui.close),'close','',true)}`);}
function confirmStart(){if(savedRaw){dialog(`<h2>${escapeHTML(SCENARIO.ui.restart)}</h2><p>${escapeHTML(SCENARIO.ui.restartText)}</p><div class="stack">${button(escapeHTML(SCENARIO.ui.confirm),'confirm-start','',true)}${button(escapeHTML(SCENARIO.ui.cancel),'close')}</div>`);}else begin(titleSetting);}
async function handle(action,el){if(busy)return;
  switch(action){
  case 'choose':if(state?.screen==='decision'){state=playChoice(state,el.dataset.id);persist();render(true);}break;
  case 'continue':state=advance(state);persist();render(true);break;
  case 'advice':advice();break;
  case 'close':$('#drawer').close();break;
  case 'start':confirmStart();break;
  case 'confirm-start':$('#drawer').close();begin(titleSetting);break;
  case 'resume':try{state=restore(savedRaw);debugRun=false;render(true);}catch{$('#announcer').textContent=SCENARIO.ui.error;savedRaw=null;render();}break;
  case 'pause':persist();state=null;render(true);break;
  case 'review':state.screen='review';persist();render(true);break;
  case 'replay-screen':state.screen='replay';persist();render(true);break;
  case 'again':begin(state.setting);break;
  case 'other':begin(state.setting==='dep'?'st':'dep');break;
  case 'print':window.print();break;
  case 'debug-apply':if(debug){const next=stateFor(state.setting,state.seed);next.cursor=SCENARIO.route.indexOf($('#debugCard').value);for(const k of ['clock','mission','file']){const n=Number($('#debug-'+k).value);next[k]=Number.isFinite(n)?(k==='clock'?n:clamp(n)):next[k];}next.flags=new Set([...document.querySelectorAll('[name=debugFlag]:checked')].map(e=>e.value));next.awarded=next.cursor>SCENARIO.route.indexOf('D9');next.screen='decision';state=next;debugRun=true;render(true);}break;
  case 'debug-simulate':if(debug){busy=true;$('#debugResult').textContent=SCENARIO.ui.working;try{const results=await simulate();$('#debugResult').textContent=JSON.stringify(results,null,2);}finally{busy=false;}}break;
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();handle(el.dataset.action,el).catch(err=>{$('#announcer').textContent=err.message;console.error(err);});}});
document.addEventListener('change',e=>{if(e.target.name==='setting'){titleSetting=e.target.value;render();document.querySelector(`input[value="${titleSetting}"]`)?.focus();}});
document.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||$('#drawer').open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(state?.screen==='decision'&&/^[123]$/.test(e.key)){e.preventDefault();const c=CARD[SCENARIO.route[state.cursor]];handle('choose',{dataset:{id:orderedChoices(state,c)[Number(e.key)-1].id}});}else if(e.key==='Enter'&&state?.screen==='event'&&e.target.tagName!=='BUTTON'){e.preventDefault();handle('continue',{});}});
$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
window.addEventListener('pagehide',persist);
window.simulate=simulate;
render();

</script></body></html>
