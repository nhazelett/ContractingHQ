# wrangler config for the HARD CALLS poll worker.
# Only needed if you deploy from the command line with wrangler.
# The dashboard copy-paste route in HARDCALLS-SETUP.md needs no npm and no CLI.

name = "hardcalls-poll"
main = "hardcalls-poll-worker.js"
compatibility_date = "2026-07-01"

# After creating the HARDCALLS_VOTES namespace, paste its ID below.
# Dashboard: Storage & Databases -> KV -> HARDCALLS_VOTES -> copy the ID.
# CLI: npx wrangler kv namespace create HARDCALLS_VOTES   (prints the id)
[[kv_namespaces]]
binding = "VOTES"
id = "PASTE_KV_NAMESPACE_ID_HERE"
