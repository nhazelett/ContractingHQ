name: ContractIntel automatic office queue
on:
  workflow_dispatch:
    inputs:
      batch:
        default: '1'
        type: string
  push:
    branches: [codex/contractintel]
    paths:
      - .github/workflows/contractintel-rollout.yml
permissions:
  contents: read
concurrency:
  group: contractintel-automatic-office-queue
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/contractintel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check dispatcher safety and original office preservation
        run: node --test contractintel/tests/automatic-dispatch.test.mjs contractintel/tests/automatic-queue.test.mjs contractintel/tests/d1-authority.test.mjs contractintel/portfolio/r2/offices.test.mjs
      - name: Reserve and process one bounded office batch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          DISPATCH_SECRET: ${{ secrets.CONTRACTINTEL_GITHUB_TOKEN }}
          ROLLOUT_BATCH: ${{ inputs.batch || '1' }}
          WRANGLER_SEND_METRICS: 'false'
        run: node contractintel/portfolio/queue/run.mjs
      - name: Save measured office report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contractintel-automatic-office-report
          retention-days: 1
          path: contractintel/portfolio/r2/out/*-r2-update.json
          if-no-files-found: ignore
