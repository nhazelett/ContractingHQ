name: Fetch Federal Register Rulemaking

on:
  schedule:
    # Run daily at 07:15 UTC.
    - cron: "15 7 * * *"
  push:
    paths:
      - ".github/workflows/fetch-federal-register.yml"
      - "scripts/fetch_federal_register.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kthq-live-data-updates
  cancel-in-progress: false

jobs:
  fetch-federal-register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Federal Register FAR/DFARS data
        run: node scripts/fetch_federal_register.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/federal-register-live.json data/federal-register-live.js && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated rulemaking data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/federal-register-live.json data/federal-register-live.js
          git commit -m "Update Federal Register rulemaking watch ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
