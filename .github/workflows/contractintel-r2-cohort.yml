name: ContractIntel FA4800 backfill and verification
on:
  workflow_dispatch:
    inputs:
      auto_resume:
        description: Continue bounded batches without this chat staying connected
        default: true
        type: boolean
      batch:
        default: '1'
        type: string
      office:
        default: FA4800
        type: choice
        options: [FA4800]
      mode:
        default: nightly
        type: choice
        options: [nightly, backfill]
      verify:
        description: Independently compare every source award and fiscal total
        default: true
        type: boolean
  push:
    branches: [codex/contractintel]
    paths:
      - contractintel/portfolio/r2/runner.mjs
      - contractintel/portfolio/r2/offices.test.mjs
      - .github/workflows/contractintel-r2-cohort.yml
permissions:
  contents: read
concurrency:
  group: contractintel-r2-FA4800
  cancel-in-progress: false
jobs:
  office:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'codex/contractintel' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check office isolation and original FA4528 preservation
        run: node --test contractintel/portfolio/r2/offices.test.mjs contractintel/portfolio/r2/ingest.test.mjs contractintel/benchmarks/r2/pilot.test.mjs contractintel/tests/portfolio-r2-read.test.mjs
      - name: Backfill or resume FA4800 and independently verify it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          PILOT_OFFICE: FA4800
          RUN_MODE: ${{ inputs.mode || 'nightly' }}
          AUTO_RESUME: ${{ github.event_name == 'push' && 'true' || inputs.auto_resume && 'true' || 'false' }}
          REQUIRE_ADMISSION: ${{ github.event_name != 'push' && !inputs.verify && 'true' || 'false' }}
          PERFORM_VERIFY: ${{ github.event_name == 'push' && 'true' || inputs.verify && 'true' || 'false' }}
          WRANGLER_SEND_METRICS: 'false'
        run: node contractintel/portfolio/r2/runner.mjs
      - name: Save measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contractintel-fa4800-r2-report
          retention-days: 1
          overwrite: true
          path: contractintel/portfolio/r2/out/fa4800-r2-update.json
          if-no-files-found: ignore
      - name: Continue the next bounded batch if needed
        if: always() && (github.event_name == 'push' || inputs.auto_resume)
        env:
          PILOT_OFFICE: FA4800
          COHORT_BATCH: ${{ inputs.batch || '1' }}
          PERFORM_VERIFY: ${{ github.event_name == 'push' && 'true' || inputs.verify && 'true' || 'false' }}
          DISPATCH_SECRET: ${{ secrets.CONTRACTINTEL_GITHUB_TOKEN }}
        run: node contractintel/portfolio/r2/resume-cohort.mjs
