name: Import professional FARCADE GLB
run-name: Import CC BY Game Boy Color model to FARCADE design branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farcade-glb-import
  cancel-in-progress: false

jobs:
  import-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out FARCADE design branch
        uses: actions/checkout@v4
        with:
          ref: design/farcade-premium-handheld-2026
          persist-credentials: true

      - name: Verify Sketchfab authentication is configured
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          if [ -z "$SKETCHFAB_TOKEN" ]; then
            echo "::error::Set the SKETCHFAB_TOKEN repository Actions secret first. Obtain your personal API token from your own Sketchfab account; never paste it into a GitHub file or a chat."
            exit 1
          fi

      - name: Download creator-enabled model through official Sketchfab API
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          set -euo pipefail
          MODEL_ID="03c6fe28d45244d2acd55486e3cfee19"
          # The Download API may accept a user API token or OAuth access token.
          # Try Sketchfab's documented token form first, then bearer format.
          CODE=$(curl --silent --show-error --retry 2 -o /tmp/sketchfab-response.json -w "%{http_code}" \
            -H "Authorization: Token $SKETCHFAB_TOKEN" \
            "https://api.sketchfab.com/v3/models/$MODEL_ID/download")
          if [ "$CODE" != "200" ]; then
            CODE=$(curl --silent --show-error --retry 2 -o /tmp/sketchfab-response.json -w "%{http_code}" \
              -H "Authorization: Bearer $SKETCHFAB_TOKEN" \
              "https://api.sketchfab.com/v3/models/$MODEL_ID/download")
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::Sketchfab download API returned HTTP $CODE. Check the token's permission and whether the model is downloadable under your account."
            exit 1
          fi
          URL=$(jq -r '.gltf.url // empty' /tmp/sketchfab-response.json)
          if [ -z "$URL" ]; then
            echo "::error::Sketchfab returned no glTF download. Verify Sketchfab account access."
            exit 1
          fi
          mkdir -p /tmp/farcade-source
          # Signed URL expires quickly; use it immediately without logging it.
          curl --fail --silent --show-error --location --retry 3 "$URL" -o /tmp/farcade-source/download.zip
          unzip -q /tmp/farcade-source/download.zip -d /tmp/farcade-source/model
          find /tmp/farcade-source/model -name '*.gltf' -print

      - name: Install image optimizer
        run: python3 -m pip install --user --disable-pip-version-check "Pillow>=10,<13"

      - name: Pack optimized glTF and textures into a standalone binary GLB
        env:
          FARCADE_TEXTURE_MAX: "1024"
          FARCADE_JPEG_QUALITY: "85"
        run: |
          set -euo pipefail
          python3 .github/scripts/farcade_pack_gltf.py /tmp/farcade-source/model assets/farcade/models/farcade-professional-source.glb
          test -s assets/farcade/models/farcade-professional-source.glb
          SIZE=$(stat -c%s assets/farcade/models/farcade-professional-source.glb)
          echo "Converted GLB size: $SIZE bytes"
          if [ "$SIZE" -ge 95000000 ]; then
            echo "::error::Converted GLB is too large for standard GitHub repository files (>=95MB). Optimize textures before committing."
            exit 1
          fi

      - name: Preserve required CC BY attribution
        run: |
          mkdir -p assets/farcade/models
          cat > assets/farcade/models/ATTRIBUTION.md <<'EOF'
          Game Boy Color by Wikiti (CC BY)
          https://sketchfab.com/3d-models/game-boy-color-03c6fe28d45244d2acd55486e3cfee19
          Original author: Wikiti. Source delivery: Sketchfab official Download API.
          Repacked to GLB for FARCADE. Preserve attribution in the KTHQ page.
          This is a third-party model, not an official Nintendo product.
          EOF

      - name: Commit asset only to the FARCADE design branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/farcade/models/farcade-professional-source.glb assets/farcade/models/ATTRIBUTION.md
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Import Wikiti textured Game Boy Color GLB for FARCADE"
          git push origin HEAD:refs/heads/design/farcade-premium-handheld-2026

      - name: Publish separate KTHQ GLB beta without touching live FARCADE
        run: |
          set -euo pipefail
          cp assets/farcade/models/farcade-professional-source.glb /tmp/farcade-professional-source.glb
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p assets/farcade/models
          cp /tmp/farcade-professional-source.glb assets/farcade/models/farcade-professional-source.glb
          git show origin/design/farcade-premium-handheld-2026:farcade-interactive-lab.html > farcade-glb-beta.html
          cat > assets/farcade/models/ATTRIBUTION.md <<'EOF'
          Game Boy Color by Wikiti (CC BY)
          https://sketchfab.com/3d-models/game-boy-color-03c6fe28d45244d2acd55486e3cfee19
          Source: Sketchfab official Download API.
          Repacked to GLB for FARCADE. Attribution and original license required.
          Not an official Nintendo product.
          EOF
          git add assets/farcade/models/farcade-professional-source.glb assets/farcade/models/ATTRIBUTION.md farcade-glb-beta.html
          if git diff --cached --quiet; then
            echo "Published beta already current."
            exit 0
          fi
          git commit -m "Publish unlisted professional GLB FARCADE beta"
          git push origin HEAD:refs/heads/main
          echo "FARCADE GLB beta published: https://kthq.org/farcade-glb-beta.html"

