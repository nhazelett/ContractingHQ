name: ContractIntel reviewed network recovery
on:
  push:
    branches: [codex/contractintel]
    paths: [.github/workflows/contractintel-network-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: contractintel-reviewed-network-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bounded retries and guarded checkpoint recovery
        run: node --test contractintel/tests/gateway-network.test.mjs contractintel/tests/automatic-dispatch.test.mjs contractintel/tests/d1-authority.test.mjs
      - name: Resume only the reviewed N00024 network stop after deployment passes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          DISPATCH_SECRET: ${{ secrets.CONTRACTINTEL_GITHUB_TOKEN }}
        run: node contractintel/portfolio/queue/recover-network-runner.mjs
