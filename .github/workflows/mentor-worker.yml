name: Deploy mentor publishing backend
on:
  workflow_dispatch:
  push:
    branches: [main, codex/mentor-essays-cleanup]
    paths:
      - working-theory-worker/**
      - .github/workflows/mentor-worker.yml
permissions:
  contents: read
concurrency:
  group: kthq-mentor-worker-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: a7443e0102de587d778491ab08fd883f
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify mentor authentication and publishing rules
        run: node --test working-theory-worker/test/*.test.mjs tests/working-theory-*.test.mjs
      - name: Deploy the mentor Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
        run: npx --yes wrangler@4.159.0 deploy --config working-theory-worker/wrangler.jsonc
      - name: Verify the live backend
        run: |
          node --input-type=module -e '
            let ready = false;
            for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch("https://kthq-mentors.nickhazelett.workers.dev/health");
            const data = await response.json();
            if (response.ok && data.originalEssaysEnabled && data.autoPublishMentorPosts && data.accountAdminEnabled) { ready = true; break; }
            await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!ready) throw new Error("Mentor backend feature check failed after propagation retries");
            const denied = await fetch("https://kthq-mentors.nickhazelett.workers.dev/admin/dashboard");
            if (denied.status !== 401) throw new Error("Admin authentication check failed");
            console.log("Live publishing features verified; admin dashboard requires authentication.");
          '
