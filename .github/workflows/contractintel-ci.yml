name: ContractIntel validation
on:
  push:
    branches: [main, codex/contractintel]
    paths: ['contractintel/**', '.github/workflows/contractintel-ci.yml']
  pull_request:
    paths: ['contractintel/**', '.github/workflows/contractintel-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s contractintel/tests -v
      - run: node --test contractintel/tests/*.test.mjs
      - run: node --check contractintel/web/app.mjs
