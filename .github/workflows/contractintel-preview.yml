name: ContractIntel preview update
on:
  workflow_dispatch:
  push:
    branches: [codex/contractintel]
    paths:
      - contractintel/web/**
      - contractintel/worker/**
      - .github/workflows/contractintel-preview.yml
permissions:
  contents: read
concurrency:
  group: contractintel-code-deployer
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: a7443e0102de587d778491ab08fd883f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate API and dashboard formatting
        run: |
          node --test contractintel/tests/*.test.mjs
          node --check contractintel/web/app.mjs
      - name: Update preview code without changing stored data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
        run: npx --yes wrangler@4.140.0 deploy --config contractintel/worker/wrangler.jsonc
