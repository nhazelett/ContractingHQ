name: ContractIntel preview update
on:
  workflow_dispatch:
    inputs:
      refresh_notices:
        description: Refresh the SAM notice index within its existing request budget
        type: boolean
        default: false
  push:
    branches: [codex/contractintel]
    paths:
      - contractintel/web/**
      - contractintel/worker/**
      - contractintel/opportunities/**
      - contractintel/tests/**
      - contractintel/portfolio/**
      - .github/workflows/contractintel-preview.yml
permissions:
  contents: read
concurrency:
  group: contractintel-code-deployer
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: a7443e0102de587d778491ab08fd883f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate API and dashboard formatting
        run: |
          node --test contractintel/tests/*.test.mjs
          node --check contractintel/web/app.mjs
      - name: Publish validated opportunity index and update dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          FORCE_OPPORTUNITY_REFRESH: ${{ inputs.refresh_notices && '1' || '0' }}
        run: |
          node contractintel/opportunities/deploy.mjs prepare
          node contractintel/opportunities/deploy.mjs refresh
          node contractintel/opportunities/deploy.mjs warm
          node contractintel/opportunities/deploy.mjs secret
          node contractintel/portfolio/deploy.mjs
          npx --yes wrangler@4.140.0 deploy --config contractintel/worker/wrangler.jsonc
      - name: Verify live opportunity data, filters, pagination, exports and assets
        run: node contractintel/opportunities/smoke.mjs
      - name: Backfill FA4528 only and verify counts and storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PORTFOLIO_INGEST_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PORTFOLIO_INGEST_SECRET"
          printf '%s' "$PORTFOLIO_INGEST_SECRET" | npx --yes wrangler@4.140.0 secret put PORTFOLIO_INGEST_SECRET --config contractintel/worker/wrangler.jsonc
          BASE=https://kthq-contractintel.nickhazelett.workers.dev
          SECRET_ATTEMPTS=$(node --input-type=module -e "import {CONFIG} from './contractintel/portfolio/ingest.mjs'; console.log(CONFIG.secretReadyAttempts)")
          SECRET_WAIT=$(node --input-type=module -e "import {CONFIG} from './contractintel/portfolio/ingest.mjs'; console.log(CONFIG.secretWaitMs/1000)")
          READY=false
          for ATTEMPT in $(seq 1 "$SECRET_ATTEMPTS"); do
            CODE=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE/api/admin/portfolio/status" -H "X-ContractIntel-Ingest-Secret: $PORTFOLIO_INGEST_SECRET")
            if [ "$CODE" = 200 ]; then READY=true; break; fi
            if [ "$CODE" != 401 ]; then echo "Unexpected readiness response: $CODE"; exit 1; fi
            sleep "$SECRET_WAIT"
          done
          if [ "$READY" != true ]; then echo 'Secret propagation has not completed; no ingestion started.'; exit 1; fi
          COMPLETE=false
          CHUNK_BUDGET=$(node --input-type=module -e "import {CONFIG} from './contractintel/portfolio/ingest.mjs'; console.log(CONFIG.maxBackfillChunks)")
          for CHUNK in $(seq 1 "$CHUNK_BUDGET"); do
            RESULT=$(curl --silent --show-error --fail-with-body --max-time 240 -X POST "$BASE/api/admin/portfolio/ingest" -H "X-ContractIntel-Ingest-Secret: $PORTFOLIO_INGEST_SECRET" -H 'Content-Type: application/json' --data '{"office":"FA4528","mode":"backfill"}') || { printf '%s\n' "$RESULT"; curl --silent --show-error --fail "$BASE/api/admin/portfolio/status" -H "X-ContractIntel-Ingest-Secret: $PORTFOLIO_INGEST_SECRET"; exit 1; }
            echo "$RESULT"
            STATUS=$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            if [ "$STATUS" = completed ]; then COMPLETE=true; break; fi
            if [ "$STATUS" != yielded ]; then echo 'Pilot ingestion stopped; checkpoint retained.'; exit 1; fi
          done
          if [ "$COMPLETE" != true ]; then echo 'Pilot chunk budget exhausted; checkpoint retained.'; exit 1; fi
          curl --silent --show-error --fail "$BASE/api/admin/portfolio/storage" -H "X-ContractIntel-Ingest-Secret: $PORTFOLIO_INGEST_SECRET" -o contractintel/portfolio/fa4528-storage.json
          node contractintel/portfolio/verify.mjs
      - name: Preserve FA4528 verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contractintel-fa4528-verification
          path: |
            contractintel/portfolio/fa4528-report.json
            contractintel/portfolio/fa4528-storage.json
          if-no-files-found: ignore
