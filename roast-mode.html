<style>

*/
:root{color-scheme:dark;--sky:#8fd8ff;--sky2:#c9efff;--floor:#ffe27a;--ink:#1d1420;--card:#fff;--pink:#f58fb4;--red:#ff5a64;--green:#3ddc97;--night:#1c181d;--navy:#040d1f;--navy2:#0a1632;--blue:#4a9eff;--gold:#c9a227;--text:#e2eaf4;--muted:#8a9bb0;--line:rgba(74,158,255,.18)}

body{margin:0;font:16px/1.55 Inter,system-ui,sans-serif;color:var(--text);background:var(--navy);background-image:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(74,158,255,.12),transparent 70%);overflow-x:clip}

.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none}.brand .k{font:700 22px Rajdhani,sans-serif;letter-spacing:2px;color:var(--blue)}.brand .f{font-size:11px;font-weight:500;color:#c8d4e0;opacity:.75;margin-top:2px}
.sep{width:1px;height:28px;background:var(--line)}
.logo{margin:0;font:700 20px Fredoka,sans-serif;letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 #d9477f}

.meta{margin-left:auto;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;color:#c8d4e0}

.big.alt{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)}.big.alt:hover{background:rgba(255,255,255,.08)}

.score{font:700 clamp(48px,9vw,76px)/1 Rajdhani,sans-serif;margin:6px 0;color:#fff}

.foot{max-width:900px;margin:0 auto;padding:18px max(4vw,14px) 32px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}.foot a{color:#c8d4e0;text-decoration:none}.foot a:hover{color:#fff}
.logo,.meta,.meta span,.chip{white-space:nowrap}
@media(max-width:520px){.brand .f,.sep{display:none}.top{gap:10px}.logo{font-size:17px}.meta{font-size:12px;gap:8px}.chip{font-size:13px;padding:5px 9px;min-height:36px}.brand .k{font-size:20px}}
@media(prefers-reduced-motion:reduce){.pig.cute .body,.shake{animation:none}}

<script>
const Q = [
{ t:`Two buys, one requirement`,
  q:`A cardholder has a known requirement worth more than the micro-purchase threshold. Can they split it into two card buys to stay under?`,
  ch:[
   {t:`Yes, if each buy is placed on a different day`,
    c:`[excited] Ooh, two little buys on two little days! That's so cle-`,
    r:`[shouting] No! That's a split purchase, you absolute {fucking} genius. Same requirement, two swipes, to duck the threshold. A calendar doesn't launder a requirement, {dumbass}.`,
    s:`[sighs] Same requirement. Two days. Truly, nobody has ever thought of this, except everyone who's ever been caught doing it.`},
   {t:`Yes, if a second cardholder makes the other buy`,
    c:`[cheerfully] Ooh, teamwork! Two cardholders, twice the fu-`,
    r:`[shouting] Twice the {fucking} audit findings! Handing half of it to a second cardholder is still a split. You didn't solve the problem, you recruited an accomplice.`,
    s:`[deadpan] The buddy system. Now two people get to explain it to the auditor.`},
   {t:`No, that's a prohibited split purchase`, ok:1},
   {t:`Yes, if you close your eyes while you swipe the card`, x:1,
    c:`[giggles] Ooh, close your eyes and make a wi-`,
    r:`[shouting] ARE YOU SERIOUSLY JUST PICKING ANSWERS TO SEE WHAT I SAY ABOUT IT? Do you really think I have time for that? I've got thirty-four more questions and a line of you {dumbasses} out the door.`,
    s:`[deadpan] You picked that on purpose. I know you did. I'm not going to dignify it.`}
  ],
  why:`The requirement is the total known at the time of purchase. Dividing it merely to stay under a threshold is prohibited, no matter how many days, cardholders, or invoices it's spread across.`,
  cite:`RFO FAR 12.001(d) and 13.001(c)`},

{ t:`"We'll paper it later"`,
  q:`A commander tells a contractor to start work now and says the paperwork will follow. What just happened?`,
  ch:[
   {t:`A binding oral agreement`,
    c:`[giggles] A verbal contract! Like a pinky promi-`,
    r:`[shouting] A verbal {goddamn} contract? Who signed it, the commander's ego? Only a contracting officer binds the government. That's an unauthorized commitment, and now some poor {bastard} has to clean it up.`,
    s:`[deadpan] Ah yes. The legally binding handshake. Right next to the legally binding "trust me, bro."`},
   {t:`An unauthorized commitment`, ok:1},
   {t:`A letter contract`,
    c:`[excited] Ooh, a letter contract! Like a love lett-`,
    r:`[shouting] A letter contract is an actual contract signed by an actual {goddamn} contracting officer. A commander running his mouth isn't one, you {fucking} pen pal.`,
    s:`[sighs] A letter contract needs a contracting officer and, you know, a letter. Neither showed up.`},
   {t:`Nothing improper, if it's papered later`,
    c:`[cheerfully] Ooh, a happy ending! It all works out in the e-`,
    r:`[shouting] No it doesn't! It was unauthorized the second he said it. Awarding something later doesn't time-travel authority backward, you {shit}-for-brains.`,
    s:`[deadpan] Retroactive authority. Not a thing. Would be nice, though.`}
  ],
  why:`Only contracting officers may sign, administer, or terminate contracts, and only within their delegated authority. An agreement made by someone without that authority is an unauthorized commitment and isn't binding unless it's ratified.`,
  cite:`RFO FAR 1.402-1(a) and 1.405(a)`},

{ t:`Who ratifies it?`,
  q:`Who can ratify an unauthorized commitment?`,
  ch:[
   {t:`The official who made the commitment`,
    c:`[excited] Ooh, the person who made the mess gets to fix i-`,
    r:`[shouting] The guy who caused it gets to approve it? Are you {shitting} me? That's letting the arsonist sign the fire report. Ratification goes up to the HCA, you {fucking} walnut.`,
    s:`[sighs] Sure. And the guy who crashed the car runs the accident investigation. Very efficient.`},
   {t:`Any contracting officer with a warrant`,
    c:`[cheerfully] Ooh, any CO with a warrant! They're all so capab-`,
    r:`[shouting] A warrant to buy stuff isn't authority to ratify! That sits with the HCA, or whoever it's delegated to, no lower than the chief of the contracting office. Read the {goddamn} rule.`,
    s:`[deadpan] Close. Wrong, but close. Ratification sits above a regular warrant.`},
   {t:`The HCA, or a designated delegate`, ok:1},
   {t:`Whoever loses at rock-paper-scissors`, x:1,
    c:`[giggles] Ooh, I love rock-paper-sciss-`,
    r:`[shouting] Oh, you think you're funny? You think I'm sitting in here for my health? I'm a {goddamn} piggy bank with a mortgage. Answer the question.`,
    s:`[deadpan] Rock-paper-scissors. Sure. I'll just wait here while you pick a real one.`}
  ],
  why:`The HCA may ratify, subject to the ratification criteria. Agencies may delegate that authority, but not below the chief of the contracting office, and agency supplements can set it higher.`,
  cite:`RFO FAR 1.405(b)(2)`},

{ t:`The COR's bright idea`,
  q:`The COR tells the contractor to add a weekend shift "since you're already here." Is that extra work authorized?`,
  ch:[
   {t:`Yes, the COR is the government's on-site rep`,
    c:`[cheerfully] Ooh, the COR's in charge! They have a clipboard and everythi-`,
    r:`[shouting] A clipboard isn't authority! The COR watches the work. They don't change the {fucking} contract. Price, quantity, quality, terms, none of it.`,
    s:`[sighs] The COR has a clipboard. The CO has the authority. Different things.`},
   {t:`Yes, once the COR documents it in writing`,
    c:`[cheerfully] Ooh, in writing! Writing makes everything offici-`,
    r:`[shouting] Writing it down doesn't give anybody {fucking} authority! The COR can't change the terms. Not in an email, not on a napkin, not in {goddamn} calligraphy.`,
    s:`[deadpan] Right. Because authority comes from the font.`},
   {t:`No, only the CO can change the terms`, ok:1},
   {t:`Yes, if it's under ten percent of contract value`,
    c:`[excited] Ooh, just a teensy little ten perce-`,
    r:`[shouting] Where did you get ten percent? You made that {goddamn} number up. There's no small-change exception for a COR, {dumbass}.`,
    s:`[deadpan] Ten percent. Invented on the spot. Impressive confidence, zero basis.`}
  ],
  why:`A COR has no authority to make commitments or changes that affect price, quality, quantity, delivery, or other terms, and must not direct the contractor to work in conflict with the contract.`,
  cite:`RFO FAR 1.404(d)`},

{ t:`"The money's coming next week"`,
  q:`An office obligates more than what's in the account because more funding "is coming next week." What is that?`,
  ch:[
   {t:`Allowed, if funds arrive before payment is due`,
    c:`[excited] Ooh, a money IOU! That's so optimist-`,
    r:`[shouting] It's a {fucking} Anti-Deficiency Act violation! You can't spend money you don't have yet. That's not budgeting, that's a {goddamn} payday loan.`,
    s:`[sighs] Spending money you don't have. Bold. Congress wrote a whole law about you.`},
   {t:`An Anti-Deficiency Act violation`, ok:1},
   {t:`Allowed, once the CO signs the obligation`,
    c:`[cheerfully] Ooh, a CO signature fixes everythi-`,
    r:`[shouting] A CO signing an overobligation just puts the CO's name on the {fucking} violation report! The signature doesn't make the money exist.`,
    s:`[deadpan] Great. Now there's a signature on the violation. Very organized.`},
   {t:`Allowed, with the commander's approval`,
    c:`[excited] Ooh, the commander said yes! Commanders are so importa-`,
    r:`[shouting] The commander doesn't outrank Congress! Nobody can authorize spending money that isn't there, not even a {goddamn} general. Sit down.`,
    s:`[sighs] The commander can approve a lot of things. Overruling the Anti-Deficiency Act isn't one of them.`}
  ],
  why:`No one may make or authorize an obligation that exceeds the amount available in an appropriation or fund. Violations must be reported.`,
  cite:`31 U.S.C. 1341(a)(1)(A); 31 U.S.C. 1351`},

{ t:`Spend it before it's gone`,
  q:`It's late September. A unit has leftover current-year O&M and wants to buy supplies it won't need until next fiscal year. Allowed?`,
  ch:[
   {t:`Yes, otherwise the funds expire unused`,
    c:`[cheerfully] Use it or lose it! Wheee, end of year shoppi-`,
    r:`[shouting] "Use it or lose it" isn't a {fucking} law! The bona fide needs rule is. If you don't need it this year, this year's money doesn't buy it. Put the cart down, {dumbass}.`,
    s:`[deadpan] Ah, September. When the bona fide needs rule becomes more of a suggestion. It isn't.`},
   {t:`Yes, if it's all delivered by September 30`,
    c:`[excited] Ooh, on-time delivery! Punctuality is so importa-`,
    r:`[shouting] The delivery date doesn't matter! It's about when the NEED is, not when the box shows up. Next year's need, next year's money, you {fucking} calendar enthusiast.`,
    s:`[sighs] The truck showing up on time doesn't change when you actually need the stuff.`},
   {t:`No, it's next year's need`, ok:1},
   {t:`Yes, if you hide the receipts`, x:1,
    c:`[giggles] Ooh, a little secret! I love secre-`,
    r:`[shouting] Did you just pick "hide the receipts" to see what I'd say? That's not a contracting answer, that's a {goddamn} confession. I'm a piggy bank, not your lawyer.`,
    s:`[deadpan] You picked "hide the receipts" just to watch me react. I'm not reacting. This is me not reacting.`}
  ],
  why:`A fixed-period appropriation is available only for needs that arise during its period of availability. Narrow exceptions exist, such as normal lead time and stock levels. "The money's expiring" isn't one of them.`,
  cite:`31 U.S.C. 1502(a)`},

{ t:`The holiday lunch`,
  q:`An office wants to use appropriated funds for a catered holiday lunch for its own employees at their regular duty station. Allowed?`,
  ch:[
   {t:`Yes, under morale and welfare`,
    c:`[giggles] Morale! Everybody loves a party, yaaay-`,
    r:`[shouting] Morale isn't a {goddamn} purpose statute exception! Taxpayers aren't buying your {fucking} sliders. Pass the hat like everybody else.`,
    s:`[sighs] Nothing says morale like a GAO decision with your office's name on it.`},
   {t:`Yes, with a signed commander's memo`,
    c:`[cheerfully] Ooh, a memo from the boss! Memos make it offici-`,
    r:`[shouting] A memo doesn't change what appropriations can buy! The commander can sign whatever {fucking} memo he wants. The sliders are still a personal expense.`,
    s:`[deadpan] The memo will look great as an exhibit.`},
   {t:`No, it's a personal expense`, ok:1},
   {t:`Yes, if it's under the micro-purchase threshold`,
    c:`[excited] Ooh, a small party! Small parties are oka-`,
    r:`[shouting] Small doesn't make it legal! The threshold is about how you buy, not whether you're allowed to buy it. A cheap illegal lunch is still an illegal {goddamn} lunch.`,
    s:`[sighs] Cheap and unauthorized is still unauthorized. Just cheaper.`}
  ],
  why:`Appropriations can only be spent on the purposes they were made for. GAO has long held that food for employees at their duty station is a personal expense, with narrow exceptions under specific authorities.`,
  cite:`31 U.S.C. 1301(a); GAO Red Book, necessary expense rule`},

{ t:`Last year's money, this year's idea`,
  q:`A contract was funded with last year's money, which has now expired. The customer wants to add brand-new, out-of-scope work and pay for it with the leftover expired funds. Allowed?`,
  ch:[
   {t:`Yes, the unobligated balance is still there`,
    c:`[excited] Ooh, found money! Like coins in the couch cushio-`,
    r:`[shouting] It's not {fucking} couch money! Expired funds can't take on new obligations. New work needs current money. It's dead, {dumbass}. Let it rest.`,
    s:`[deadpan] Spending from the expired account. A classic way to become a training slide.`},
   {t:`Yes, by bilateral mod with contractor agreement`,
    c:`[cheerfully] Ooh, everybody agrees! Teamwork makes the dream wo-`,
    r:`[shouting] The contractor doesn't get a vote on appropriations law! They'll agree to anything that pays them. That's not consent, that's a {fucking} sales pitch.`,
    s:`[sighs] Shockingly, the contractor is fine with getting paid. Still not allowed.`},
   {t:`No, new work needs current funds`, ok:1},
   {t:`Yes, if you ask the money nicely`, x:1,
    c:`[giggles] Aww, manners! Please and thank yo-`,
    r:`[shouting] ARE YOU KIDDING ME? "Ask the money nicely"? I've got a whole quiz to get through and you're out here clicking the joke answers. Answer the {goddamn} question.`,
    s:`[sighs] You knew that one was wrong. I know you knew. Let's move on.`}
  ],
  why:`Expired accounts stay available only to record, adjust, and liquidate obligations properly chargeable to them. New out-of-scope work is a new obligation and needs current funds.`,
  cite:`31 U.S.C. 1553(a); 31 U.S.C. 1502(a)`},

{ t:`Crossing the fiscal year`,
  q:`Can DoD award a 12-month severable services contract that starts in August, funded entirely with current-year O&M?`,
  ch:[
   {t:`No, annual funds can't cross fiscal years`,
    c:`[cheerfully] Ooh, playing it super-duper sa-`,
    r:`[shouting] You're scared of a {goddamn} calendar! The law literally lets you do this. Up to one year, obligate the whole thing up front. Quit inventing rules, you {fucking} hall monitor.`,
    s:`[sighs] Inventing a prohibition that doesn't exist. Very thorough. Very wrong.`},
   {t:`Yes, if the period is 12 months or less`, ok:1},
   {t:`Yes, for up to five years`,
    c:`[excited] Ooh, five whole years! That's so much planni-`,
    r:`[shouting] Five years? Where'd you pull that from? It's ONE year. Annual money, one-year period. Multiyear is a whole different {fucking} animal.`,
    s:`[deadpan] Five years. Ambitious. The statute says one.`},
   {t:`Only if the services are non-severable`,
    c:`[cheerfully] Ooh, big words! Non-severable sounds so smar-`,
    r:`[shouting] It sounds smart and it's backwards! This authority is specifically for SEVERABLE services. You flipped the whole {goddamn} rule.`,
    s:`[sighs] Right idea, wrong word. The authority covers severable services.`}
  ],
  why:`DoD can enter into a severable services contract that begins in one fiscal year and ends in the next, if the period doesn't exceed one year, and can obligate the total amount with funds from the first year.`,
  cite:`10 U.S.C. 3133`},

{ t:`Fee as a percentage`,
  q:`A contractor proposes a fee of ten percent of whatever their actual costs turn out to be. Acceptable?`,
  ch:[
   {t:`Yes, it's a standard fee arrangement`,
    c:`[excited] Ooh, standard! Everybody does i-`,
    r:`[shouting] Everybody does NOT do it, because it's been illegal forever! The more they spend, the more they make. You just reinvented the worst incentive in contracting, you {fucking} visionary.`,
    s:`[deadpan] Standard in the sense that it's the standard example of what's prohibited.`},
   {t:`Yes, if the fee has a ceiling`,
    c:`[excited] Ooh, a ceiling! Ceilings keep everyone safe and co-`,
    r:`[shouting] A ceiling doesn't fix it! The more they spend, the more they make. That's cost-plus-percentage-of-cost, and it's been banned since before your {fucking} grandpa had a warrant.`,
    s:`[deadpan] Pay them more the more they spend. What could possibly go wrong.`},
   {t:`No, that's cost-plus-percentage-of-cost`, ok:1},
   {t:`Yes, for services contracts`,
    c:`[cheerfully] Ooh, just for services! A nice little exceptio-`,
    r:`[shouting] There is no services exception! Supplies, services, whatever. It's banned. Stop making up carve-outs, {dumbass}.`,
    s:`[sighs] No services carve-out. Banned is banned.`}
  ],
  why:`The cost-plus-a-percentage-of-cost system of contracting may not be used. A fee that rises automatically with incurred cost is the defining feature, with or without a cap.`,
  cite:`10 U.S.C. 3322(a)`},

{ t:`The holiday gift`,
  q:`A contractor drops off a $75 Bluetooth speaker for the contracting officer at Christmas. Can the CO keep it?`,
  ch:[
   {t:`Yes, holiday gifts are an exception`,
    c:`[excited] Ooh, Christmas! The season of givi-`,
    r:`[shouting] The ethics rules don't take {fucking} Christmas off! Seventy-five bucks from a contractor is a gift from a prohibited source. Give it back.`,
    s:`[deadpan] Ethics rules: still in effect in December. Shocking, I know.`},
   {t:`Yes, if the CO pays the $55 difference`,
    c:`[giggles] Ooh, a little layaway plan! That's so thrif-`,
    r:`[shouting] You can't buy down a {goddamn} gift! Over twenty bucks, you can't pay the difference to keep it. Give it back, you {fucking} magpie.`,
    s:`[sighs] Haggling with the ethics rules. A brave choice.`},
   {t:`No, it's over the $20 limit`, ok:1},
   {t:`Yes, if it's acknowledged in writing`,
    c:`[cheerfully] Aww, a thank-you note! Manners are so importa-`,
    r:`[shouting] A thank-you note? You think stationery launders a {goddamn} gift? Now you've got the speaker AND written evidence.`,
    s:`[deadpan] Lovely penmanship. Still have to give it back.`}
  ],
  why:`Employees may not accept gifts from a prohibited source. The exception allows unsolicited gifts of $20 or less per source per occasion, up to $50 a year from one source. If a gift is worth more than $20, the employee can't pay the excess to keep it.`,
  cite:`5 CFR 2635.202(a) and 2635.204(a)`},

{ t:`Protest clock`,
  q:`A losing offeror learns the basis for a protest that isn't about a solicitation defect, and there was no required debriefing. How long do they have to file at GAO?`,
  ch:[
   {t:`30 days`,
    c:`[cheerfully] Ooh, a whole month! Plenty of ti-`,
    r:`[shouting] Not a month! Ten days. You'd blow the deadline three {fucking} times over.`,
    s:`[deadpan] Thirty is a nice number. Ten is the right one.`},
   {t:`10 days`, ok:1},
   {t:`Any time before performance starts`,
    c:`[cheerfully] Ooh, no rush! Take your time, sweeti-`,
    r:`[shouting] Ten {fucking} days! GAO doesn't care that you were busy. Miss it and you're out, you {goddamn} snail.`,
    s:`[deadpan] GAO loves a relaxed timeline. Said no one.`},
   {t:`Whenever Mercury is out of retrograde`, x:1,
    c:`[excited] Ooh, astrology! What's your si-`,
    r:`[shouting] You're clicking the astrology answer? On a contracting quiz? You think I'm up here doing improv for free? Ten days. Pick real answers, you {fucking} gremlin.`,
    s:`[deadpan] You picked the astrology one to see what I'd do. I'm a piggy bank. I'm doing nothing.`}
  ],
  why:`Protests not based on solicitation improprieties must be filed within 10 days after the basis was known or should have been known. When a debriefing is required and requested, the clock runs from the debriefing instead.`,
  cite:`4 CFR 21.2(a)(2)`},

{ t:`"We just like them"`,
  q:`The customer wants a sole-source award because they "really like working with" the incumbent. Valid basis?`,
  ch:[
   {t:`Yes, the customer owns the requirement`,
    c:`[cheerfully] Ooh, the customer's always ri-`,
    r:`[shouting] The customer owns the requirement, not the competition rules! They don't get to pick the winner because they like the guy. That's not a requirement, that's a {goddamn} crush.`,
    s:`[sighs] The customer owns the need. Not the competition rules.`},
   {t:`Yes, with a written customer preference memo`,
    c:`[excited] Ooh, a memo! Memos are magi-`,
    r:`[shouting] A memo that says "we like them" is a {fucking} love letter, not a justification! Competition law doesn't have a friendship exception, {dumbass}.`,
    s:`[sighs] "Justification: vibes." Bold. Not legal, but bold.`},
   {t:`No, that's not a valid exception`, ok:1},
   {t:`Yes, if the price is fair and reasonable`,
    c:`[cheerfully] Ooh, a fair price! Fair is goo-`,
    r:`[shouting] A fair price is required either way! It doesn't create a sole-source exception. You need an actual statutory basis, not a coupon, {dumbass}.`,
    s:`[deadpan] A fair price is the floor, not a justification.`}
  ],
  why:`DoD must get full and open competition unless a statutory exception applies, and using one requires a written justification and approval. Simplified buys have their own sole-source documentation rules, and liking the incumbent doesn't meet those either.`,
  cite:`10 U.S.C. 3201(a); 10 U.S.C. 3204(a) and (e)`},

{ t:`Pay me first`,
  q:`A contractor asks for full payment before starting the work. Can you just pay it?`,
  ch:[
   {t:`Yes, if the contractor requests it`,
    c:`[excited] Ooh, generous! Paying people is so ni-`,
    r:`[shouting] You don't just pay it! Payment comes after value is received unless a law says otherwise. Hand out cash up front and watch them vanish, you {fucking} philanthropist.`,
    s:`[deadpan] Very generous. Also not how payment works.`},
   {t:`Only with specific legal authority`, ok:1},
   {t:`Yes, on a firm-fixed-price contract`,
    c:`[cheerfully] Ooh, fixed price! So stable and predicta-`,
    r:`[shouting] Contract type doesn't authorize advance payment! Fixed price sets the price. It doesn't let you pay before delivery. Different {goddamn} concepts.`,
    s:`[sighs] Fixed price sets the price. Not the payment timing.`},
   {t:`Yes, if the contractor is trusted`,
    c:`[giggles] Aww, trust! Friendship is the best currency, isn't i-`,
    r:`[shouting] Trust isn't a {goddamn} payment authority! You don't pay before you get something unless a law says you can. Feelings don't clear the {fucking} Treasury.`,
    s:`[deadpan] Payment by vibes. Treasury will be thrilled.`}
  ],
  why:`Payment may not exceed the value of services rendered or goods delivered, unless a law specifically authorizes advance payment. Contract financing authorities, including the commercial ones, are among those laws, each with its own conditions.`,
  cite:`31 U.S.C. 3324(a) and (b)`},

{ t:`"Start now, pay us later"`,
  q:`A contractor says, "Don't worry about the contract, we'll start now and you can pay us when the money comes in." You say yes. What's wrong?`,
  ch:[
   {t:`Nothing, there's no cost yet`,
    c:`[excited] Free stuff! Everybody loves free stu-`,
    r:`[shouting] It's not {fucking} free! It's a bill with a delay timer. Accepting voluntary services is illegal, and they'll come back with a claim. Nothing is free, you {goddamn} coupon clipper.`,
    s:`[sighs] Free now, invoice later. The oldest magic trick in contracting.`},
   {t:`Nothing, the contractor offered`,
    c:`[cheerfully] Aww, they offered! How sweet of the-`,
    r:`[shouting] Sweet? It's a {fucking} trap! Them offering doesn't make it legal for you to accept. They'll send the bill later and call it a claim.`,
    s:`[deadpan] They offered. You still can't accept. Funny how that works.`},
   {t:`It's an improper voluntary service`, ok:1},
   {t:`Nothing, if you pinky swear not to tell anyone`, x:1,
    c:`[giggles] Ooh, a pinky swear! Those are totally bindi-`,
    r:`[shouting] NO. I'm not doing this. You're clicking the pinky swear answer to see if I'll yell. I will. Every time. I don't get paid enough for this {shit}.`,
    s:`[sighs] Pinky swear. Sure. Pick a real answer when you're done having fun.`}
  ],
  why:`The government may not accept voluntary services, except as authorized by law or in emergencies involving the safety of human life or the protection of property.`,
  cite:`31 U.S.C. 1342`},
{ t:`"He seemed like he was in charge"`, hard:1,
  q:`A contractor did extra work because a colonel told them to, and the colonel acted like he had the authority. Is the government bound?`,
  ch:[
   {t:`Yes, the contractor relied in good faith`,
    c:`[cheerfully] Aww, good faith! Trust is so importa-`,
    r:`[shouting] Good faith doesn't create authority! The government is only bound by people with ACTUAL authority. The contractor took orders from a guy with eagles and no warrant, and now that's a {fucking} problem.`,
    s:`[sighs] The contractor trusted him. That's sweet. Legally irrelevant, but sweet.`},
   {t:`Yes, if he outranks the CO`,
    c:`[excited] Ooh, rank! Colonels are super-duper importa-`,
    r:`[shouting] Rank isn't a warrant! A colonel can outrank the CO all {goddamn} day and still can't bind the government to a dime. Authority comes from the warrant, not the collar, {dumbass}.`,
    s:`[deadpan] Rank and contracting authority. Two completely different things. Who knew. Everyone. Everyone knew.`},
   {t:`No, only actual authority binds it`, ok:1},
   {t:`Yes, if he used his command voice`, x:1,
    c:`[giggles] Ooh, the command voi-`,
    r:`[shouting] The COMMAND VOICE? Are you just clicking these to hear me yell? Because it's working, and I hate it. No warrant, no authority, you {fucking} clown.`,
    s:`[deadpan] The command voice. Sure. Pick an answer a lawyer would recognize.`}
  ],
  why:`The government is bound only by people with actual authority, and anyone dealing with the government carries the risk of checking that authority. Apparent authority doesn't bind it. A commitment made without authority is unauthorized unless it's ratified.`,
  cite:`Federal Crop Insurance Corp. v. Merrill, 332 U.S. 380 (1947); RFO FAR 1.402-1(a)`},

{ t:`The ratification checklist`, hard:1,
  q:`Which of these is NOT a requirement for ratifying an unauthorized commitment?`,
  ch:[
   {t:`The government received a benefit from the performance`,
    c:`[cheerfully] Ooh, the government got something nice! That's not needed at a-`,
    r:`[shouting] Yes it {fucking} is! No benefit to the government, no ratification. That one's literally on the list.`,
    s:`[sighs] That one's required. The government has to have actually gotten something.`},
   {t:`The price is fair and reasonable`,
    c:`[excited] Ooh, fair prices are optiona-`,
    r:`[shouting] Optional? The CO has to find the price fair and reasonable or there's nothing to ratify. You'd just pay whatever the guy invoices, you {goddamn} ATM.`,
    s:`[deadpan] Fair and reasonable price. Required. Shocking, I know.`},
   {t:`Funds were available when the commitment was made, and still are`,
    c:`[giggles] Ooh, money stuff! Who needs mone-`,
    r:`[shouting] Everybody needs money! Funds had to be there when the commitment was made AND now. Miss either one and you've stacked an Anti-Deficiency problem on top of the first {fucking} problem.`,
    s:`[sighs] Funds then and funds now. Both required. Money tends to matter.`},
   {t:`The contractor waives profit on the work`, ok:1}
  ],
  why:`Ratification requires that the government received a benefit, the ratifying official has authority, the contract would otherwise have been proper, the price is fair and reasonable, the CO recommends payment with legal counsel's concurrence, and funds were available then and now. Nothing requires the contractor to give up profit.`,
  cite:`RFO FAR 1.405(c)`},

{ t:`The automatic stay`, hard:1,
  q:`Award was made 12 days ago, and nobody requested a debriefing. A protest just landed at GAO. Does performance have to stop automatically?`,
  ch:[
   {t:`Yes, any GAO protest triggers the stay`,
    c:`[cheerfully] Ooh, a protest! Everybody freeze-`,
    r:`[shouting] No! The stay has a window. Ten days after award, or five after a required debriefing. Miss it and performance keeps rolling. Twelve days is twelve days, {dumbass}.`,
    s:`[deadpan] Not any protest. A timely one. The calendar matters here.`},
   {t:`No, the stay window has passed`, ok:1},
   {t:`Yes, if the protester is a small business`,
    c:`[excited] Ooh, small businesses get special treatme-`,
    r:`[shouting] Not for this! The stay window is the same for everybody. Size status doesn't stop the {goddamn} clock.`,
    s:`[sighs] Small business status doesn't change the stay window.`},
   {t:`Only if the protester sends a fruit basket`, x:1,
    c:`[giggles] Ooh, a fruit bask-`,
    r:`[shouting] A FRUIT BASKET? You think GAO runs on fruit? I'm not doing this with you. Ten days, five days, read the {fucking} statute.`,
    s:`[deadpan] A fruit basket. You're picking these just to watch me suffer, aren't you.`}
  ],
  why:`Performance stops automatically only when the agency gets notice of the protest within the later of 10 days after award or 5 days after a required, requested debriefing date. A protest filed after that window can still be timely at GAO, but performance doesn't stop on its own.`,
  cite:`31 U.S.C. 3553(d)(3) and (d)(4)`},

{ t:`Two bites at the apple`, hard:1,
  q:`An offeror filed a timely agency-level protest, and the agency denied it. How long does the offeror have to take it to GAO?`,
  ch:[
   {t:`10 days from the agency's denial`, ok:1},
   {t:`10 days from the original protest basis`,
    c:`[cheerfully] Ooh, the original clo-`,
    r:`[shouting] Wrong clock! Once a timely agency protest is filed, the GAO clock runs from the initial adverse agency action. Different trigger, same ten {fucking} days.`,
    s:`[sighs] Right number, wrong starting line.`},
   {t:`Until reconsideration requests run out`,
    c:`[excited] Ooh, keep asking! Persistence pays o-`,
    r:`[shouting] Persistence pays nothing! Asking for reconsideration doesn't pause the clock. Ten days from that first denial, and you're {goddamn} done.`,
    s:`[deadpan] Reconsideration requests don't stop the clock. GAO has dismissed plenty of people who thought they did.`},
   {t:`30 days from the denial`,
    c:`[cheerfully] Ooh, a whole month to thin-`,
    r:`[shouting] There's no month! It's ten days. GAO doesn't hand out bonus weeks for having a bad day, {dumbass}.`,
    s:`[sighs] Thirty days. Generous. Also made up.`}
  ],
  why:`When a timely agency-level protest was filed first, a later GAO protest must be filed within 10 days of actual or constructive knowledge of initial adverse agency action. Asking the agency to reconsider doesn't extend that.`,
  cite:`4 CFR 21.2(a)(3)`},

{ t:`The uncertified claim`, hard:1,
  q:`A contractor submits a $150,000 claim with no certification and asks for a final decision. What's the situation?`,
  ch:[
   {t:`The CO must decide within 60 days anyway`,
    c:`[cheerfully] Ooh, the sixty-day ru-`,
    r:`[shouting] Sixty days is for claims that are actually claims! Over a hundred grand, it has to be certified. No certification, the CO tells them so and doesn't decide a {fucking} thing.`,
    s:`[deadpan] Sixty days matters. Just not the way you think. Certification comes first.`},
   {t:`The CO can decline to decide it`, ok:1},
   {t:`Nothing, certification starts at $1 million`,
    c:`[excited] Ooh, a million dollars! That's so much mon-`,
    r:`[shouting] Where'd you get a million? It's a hundred thousand. You added a zero and a {goddamn} attitude.`,
    s:`[sighs] A million. You're off by a factor of ten.`},
   {t:`The claim is permanently barred`,
    c:`[cheerfully] Ooh, game over for the contract-`,
    r:`[shouting] It's not game over! They certify it and resubmit. A defective certification can even be fixed later. Nobody loses a claim forever over a {fucking} signature block.`,
    s:`[deadpan] Not forever. They certify it and come back. Paperwork, not doom.`}
  ],
  why:`A claim over $100,000 must be certified. If the certification is missing or defective, the CO doesn't have to issue a decision, as long as the CO tells the contractor in writing within 60 days. A defective certification can be corrected later.`,
  cite:`41 U.S.C. 7103(b)`},

{ t:`After the final decision`, hard:1,
  q:`A contractor just received the contracting officer's final decision on a claim. How long do they have to appeal?`,
  ch:[
   {t:`90 days to a board, 12 months to the court`, ok:1},
   {t:`30 days to either forum`,
    c:`[excited] Ooh, thirty days! Nice and spee-`,
    r:`[shouting] Thirty days isn't in the statute! Ninety to a board, twelve months to the court. You just invented a deadline, {dumbass}.`,
    s:`[deadpan] Thirty days. Nice round number. Not the law.`},
   {t:`6 years, like the claim deadline`,
    c:`[cheerfully] Ooh, six whole yea-`,
    r:`[shouting] Six years is for submitting the CLAIM. Once there's a final decision, a new clock starts, and it's way {goddamn} shorter.`,
    s:`[sighs] Six years gets you to the claim. The appeal clock is much shorter.`},
   {t:`Until the contracting officer retires`, x:1,
    c:`[giggles] Ooh, a retirement par-`,
    r:`[shouting] ARE YOU SERIOUS? You picked the retirement answer just to hear me yell. I'm a piggy bank. I'm never retiring. Ninety days or twelve months, you {fucking} menace.`,
    s:`[deadpan] You clicked that one for fun. I can tell. Ninety days or twelve months.`}
  ],
  why:`A contractor can appeal a final decision to the agency board of contract appeals within 90 days of receiving it, or bring an action at the Court of Federal Claims within 12 months.`,
  cite:`41 U.S.C. 7104(a) and (b)(3)`},

{ t:`Small business overseas`, hard:1,
  q:`A deployed contracting officer outside the United States is buying something above the micro-purchase threshold. Is a small business set-aside required?`,
  ch:[
   {t:`Yes, the rule of two applies everywhere`,
    c:`[cheerfully] Ooh, rules everywhere! Consistency is so importa-`,
    r:`[shouting] Not everywhere! Part 19 is mandatory in the U.S. and its outlying areas. Overseas, it's the CO's call. Read the {goddamn} applicability section.`,
    s:`[deadpan] Everywhere. Except the places it doesn't apply. Which includes where you are.`},
   {t:`No, it's optional outside the U.S.`, ok:1},
   {t:`Yes, but only for services`,
    c:`[excited] Ooh, just services! A little special ru-`,
    r:`[shouting] There's no services-only rule! You made up a carve-out to look smart and it made you look {fucking} dumb.`,
    s:`[sighs] No services carve-out. Part 19 just isn't required overseas.`},
   {t:`Yes, if it's over the SAT`,
    c:`[excited] Ooh, the big threshold! Bigger rules for bigger bu-`,
    r:`[shouting] The dollar value doesn't change where Part 19 applies! Overseas it's optional at any size, you {fucking} spreadsheet.`,
    s:`[deadpan] Bigger dollar amount, same geography. Still optional.`}
  ],
  why:`Contracting officers must apply Part 19 in the United States and its outlying areas, and may apply it outside them. Subcontracting plans also aren't required for contracts performed entirely outside the U.S.`,
  cite:`RFO FAR 19.000(b)(1); RFO FAR 19.109(b)(3)`},

{ t:`Generators for the deployed location`, hard:1,
  q:`A deployed contracting officer is buying generators for use at a location outside the United States. Does the Buy American statute apply?`,
  ch:[
   {t:`Yes, it covers all federal supply buys`,
    c:`[cheerfully] Ooh, every purchase! America everywhe-`,
    r:`[shouting] Not every purchase! The statute has an exception for stuff used outside the U.S. Your generators are overseas. Read the {fucking} exceptions.`,
    s:`[deadpan] Every purchase, except the ones in the exceptions. Like this one.`},
   {t:`Yes, for manufactured end products`,
    c:`[excited] Ooh, manufactured stuff! Factories are so co-`,
    r:`[shouting] Manufactured or not, it's going overseas! The use-outside-the-U.S. exception doesn't care how it was made, you {goddamn} assembly line.`,
    s:`[sighs] How it's made doesn't matter here. Where it's used does.`},
   {t:`No, not for use outside the U.S.`, ok:1},
   {t:`Only if shipped on a U.S.-flag vessel`,
    c:`[cheerfully] Ooh, a big American boa-`,
    r:`[shouting] That's a totally different law! Shipping preference isn't Buy American. You mashed two statutes together like a {fucking} toddler with clay.`,
    s:`[deadpan] Different law. Shipping rules aren't Buy American.`}
  ],
  why:`The Buy American statute doesn't apply to articles, materials, or supplies for use outside the United States. Other rules, such as trade agreements, DFARS restrictions, and cargo preference, apply on their own terms.`,
  cite:`41 U.S.C. 8302(a)(2)(A)`},

{ t:`The 18-month study`, hard:1,
  q:`In September, a unit awards a contract for a single study with one final report, which will take 18 months. Which funds pay for it?`,
  ch:[
   {t:`Current-year funds, for the whole contract`, ok:1},
   {t:`Each year's funds for that year's work`,
    c:`[cheerfully] Ooh, split it up by year! So neat and ti-`,
    r:`[shouting] It's NON-severable! One job, one end product. You can't chop it into fiscal years. The whole {fucking} thing gets funded when it's awarded.`,
    s:`[deadpan] Neat. Wrong. A single end product can't be split across years.`},
   {t:`Next year's funds, since most work happens then`,
